name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish wiki/
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki/
          strategy: init
          token: ${{ secrets.GITHUB_TOKEN }}
